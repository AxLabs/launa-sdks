[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ax402-sdk"
version = "0.0.1"
description = "Ax402 platform control-plane SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://ax402.io"
Repository = "https://github.com/AxLabs/ax402-sdks"
Documentation = "https://github.com/AxLabs/ax402-sdks/tree/main/docs/sdks/python"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-httpx>=0.30.0"]
buyer = ["x402[httpx,evm]>=2.0.0", "eth-account>=0.13.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/ax402_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
