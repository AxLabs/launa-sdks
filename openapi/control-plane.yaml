openapi: 3.1.0
info:
  title: Launa Control Plane API
  version: 1.0.0
  description: Admin API for launa-backend. Gateway payment flows use standard x402, not this API. Operator routes under /internal are omitted.
servers:
  - url: http://api.localhost:8090
    description: Local default (ADMIN_HOST)
security:
  - ApiKeyAuth: []
  - BearerAuth: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Scoped key launa_live_...
    BearerAuth:
      type: http
      scheme: bearer
      description: JWT from signup/login or launa_live_ API key
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        onboarding_completed: { type: boolean }
        email_verified: { type: boolean }
    AuthResponse:
      type: object
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/User' }
    APIKey:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        key_prefix: { type: string }
        scopes: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
    CreatedAPIKey:
      allOf:
        - { $ref: '#/components/schemas/APIKey' }
        - type: object
          properties:
            key: { type: string, description: Shown once on create }
    PlatformConfig:
      type: object
      properties:
        platform_domain: { type: string }
        gateway_cname_target: { type: string }
        gateway_port: { type: integer }
        admin_host: { type: string }
        access:
          type: object
          properties:
            mode: { type: string, enum: [open, waitlist_only] }
            waitlist_headline: { type: string }
            waitlist_subhead: { type: string }
    WaitlistJoinRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        name: { type: string }
        company: { type: string }
        source: { type: string }
    WaitlistJoinResponse:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
    AcceptOption:
      type: object
      required: [scheme, network, asset, amount]
      properties:
        scheme: { type: string }
        network: { type: string }
        asset: { type: string }
        amount: { type: string }
        max_timeout_seconds: { type: integer }
        extra: { type: object }
    API:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        upstream_base_url: { type: string }
        pay_to_mode: { type: string, enum: [user_wallet, platform_wallet] }
        pay_to_address: { type: string }
        domains: { type: array, items: { type: object } }
    Endpoint:
      type: object
      properties:
        id: { type: string }
        api_id: { type: string }
        method: { type: string }
        path_pattern: { type: string }
        enabled: { type: boolean }
        accepts: { type: array, items: { $ref: '#/components/schemas/AcceptOption' } }
    SupportedKind:
      type: object
      properties:
        scheme: { type: string }
        network: { type: string }
        asset: { type: string }
        x402Version: { type: integer }
        extra: { type: object, additionalProperties: true }
    SupportedResponse:
      type: object
      properties:
        kinds: { type: array, items: { $ref: '#/components/schemas/SupportedKind' } }
        signers: { type: object, additionalProperties: { type: array, items: { type: string } } }
    FacilitatorEndpoint:
      type: object
      properties:
        base_url: { type: string }
        hostname: { type: string }
        slug: { type: string }
        provision_pending: { type: boolean }
        environment: { type: string, enum: [production, development] }
        uses_dev_facilitator: { type: boolean }
        supported: { $ref: '#/components/schemas/SupportedResponse' }
        supported_error: { type: string }
    FacilitatorStats:
      type: object
      properties:
        verify_count: { type: integer }
        settle_count: { type: integer }
        verify_ok: { type: integer }
        settle_ok: { type: integer }
        success_rate: { type: number }
    FacilitatorEvent:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        event_type: { type: string }
        hostname: { type: string }
        success: { type: boolean }
        created_at: { type: string, format: date-time }
        scheme: { type: string }
        network: { type: string }
        asset: { type: string }
        amount: { type: string }
        pay_to: { type: string }
        payer: { type: string }
        transaction: { type: string }
        reason: { type: string }
        message: { type: string }
    FacilitatorEventsPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/FacilitatorEvent' } }
        total: { type: integer }
paths:
  /auth/signup:
    post:
      summary: Register account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
  /auth/login:
    post:
      summary: Login
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
  /auth/logout:
    post:
      summary: Logout
      security: []
      responses:
        '200':
          description: OK
  /auth/verify-email:
    post:
      summary: Verify email
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: verified
  /auth/me:
    get:
      summary: Current user
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /auth/resend-verification:
    post:
      summary: Resend email verification
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
  /auth/forgot-password:
    post:
      summary: Request password reset email
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
  /auth/reset-password:
    post:
      summary: Reset password with email token
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
  /auth/password:
    put:
      summary: Change password
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
  /auth/onboarding/complete:
    post:
      summary: Mark onboarding complete
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                skipped: { type: boolean }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /auth/facilitator:
    get:
      summary: Dedicated facilitator endpoint for the user account
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FacilitatorEndpoint' }
  /auth/facilitator/supported:
    get:
      summary: Refresh facilitator /supported capabilities
      responses:
        '200':
          description: x402 SupportedResponse JSON
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportedResponse' }
  /auth/facilitator/stats:
    get:
      summary: Facilitator verify/settle stats
      parameters:
        - name: days
          in: query
          schema: { type: integer, default: 30 }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FacilitatorStats' }
  /auth/facilitator/events:
    get:
      summary: Paginated facilitator verify/settle event log (JWT only)
      parameters:
        - name: days
          in: query
          schema: { type: integer, default: 30 }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FacilitatorEventsPage' }
  /auth/scopes:
    get:
      summary: List available API key scopes (JWT only)
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  scopes: { type: array, items: { type: string } }
  /auth/api-keys:
    get:
      summary: List API keys (JWT only)
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/APIKey' }
    post:
      summary: Create API key (JWT only)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string }
                scopes: { type: array, items: { type: string } }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedAPIKey' }
  /auth/api-keys/{keyID}:
    delete:
      summary: Revoke API key (JWT only)
      parameters:
        - name: keyID
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: revoked
  /config/platform:
    get:
      summary: Platform configuration
      security: []
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformConfig' }
  /waitlist:
    post:
      summary: Join the seller waitlist
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WaitlistJoinRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WaitlistJoinResponse' }
        '409':
          description: Already on waitlist
  /domains/suggest:
    get:
      summary: Suggest gateway domain plan
      x-required-scope: domains:read
      parameters:
        - name: apex
          in: query
          required: true
          schema: { type: string }
        - name: prefix
          in: query
          schema: { type: string, default: x402 }
        - name: upstream_path
          in: query
          schema: { type: string, default: /api }
      responses:
        '200':
          description: domain plan
  /apis:
    get:
      summary: List APIs
      x-required-scope: apis:read
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/API' }
    post:
      summary: Create API
      x-required-scope: apis:write
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, slug, upstream_base_url]
              properties:
                name: { type: string }
                slug: { type: string }
                upstream_base_url: { type: string }
                pay_to_mode: { type: string }
                pay_to_address: { type: string }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/API' }
  /apis/{apiID}:
    get:
      summary: Get API
      x-required-scope: apis:read
      parameters:
        - { name: apiID, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/API' }
    put:
      summary: Update API
      x-required-scope: apis:write
      parameters:
        - { name: apiID, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/API' }
    delete:
      summary: Delete API
      x-required-scope: apis:write
      parameters:
        - { name: apiID, in: path, required: true, schema: { type: string } }
      responses:
        '204':
          description: deleted
  /apis/{apiID}/endpoints:
    get:
      summary: List endpoints
      x-required-scope: endpoints:read
      parameters:
        - { name: apiID, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Endpoint' }
    post:
      summary: Create endpoint
      x-required-scope: endpoints:write
      parameters:
        - { name: apiID, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [method, path_pattern, accepts]
              properties:
                method: { type: string }
                path_pattern: { type: string }
                accepts: { type: array, items: { $ref: '#/components/schemas/AcceptOption' } }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Endpoint' }
  /apis/{apiID}/endpoints/{endpointID}:
    put:
      summary: Update endpoint
      x-required-scope: endpoints:write
      parameters:
        - { name: apiID, in: path, required: true, schema: { type: string } }
        - { name: endpointID, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                method: { type: string }
                path_pattern: { type: string }
                enabled: { type: boolean }
                accepts: { type: array, items: { $ref: '#/components/schemas/AcceptOption' } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Endpoint' }
    delete:
      summary: Delete endpoint
      x-required-scope: endpoints:write
      parameters:
        - { name: apiID, in: path, required: true, schema: { type: string } }
        - { name: endpointID, in: path, required: true, schema: { type: string } }
      responses:
        '204':
          description: deleted
  /apis/{apiID}/domains:
    get:
      summary: List domains
      x-required-scope: domains:read
      parameters:
        - { name: apiID, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: domain list
    post:
      summary: Add domain
      x-required-scope: domains:write
      parameters:
        - { name: apiID, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [hostname]
              properties:
                hostname: { type: string }
      responses:
        '201':
          description: domain setup instructions
  /apis/{apiID}/domains/{domainID}:
    delete:
      summary: Remove custom domain
      x-required-scope: domains:write
      parameters:
        - { name: apiID, in: path, required: true, schema: { type: string } }
        - { name: domainID, in: path, required: true, schema: { type: string } }
      responses:
        '204':
          description: removed
  /apis/{apiID}/domains/{domainID}/verify:
    post:
      summary: Verify domain DNS
      x-required-scope: domains:write
      parameters:
        - { name: apiID, in: path, required: true, schema: { type: string } }
        - { name: domainID, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: verified
  /openapi/parse:
    post:
      summary: Parse OpenAPI spec
      x-required-scope: openapi:read
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                spec: { type: string }
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: parsed operations
  /apis/{apiID}/openapi/import:
    post:
      summary: Import OpenAPI operations as endpoints
      x-required-scope: openapi:read
      parameters:
        - { name: apiID, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: import result
  /stats/overview:
    get:
      summary: Account stats overview
      x-required-scope: stats:read
      parameters:
        - name: days
          in: query
          schema: { type: integer, default: 30 }
      responses:
        '200':
          description: stats
  /apis/{apiID}/stats:
    get:
      summary: Per-API stats
      x-required-scope: stats:read
      parameters:
        - { name: apiID, in: path, required: true, schema: { type: string } }
        - name: days
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: api stats
  /apis/{apiID}/settlements:
    get:
      summary: List settlements
      x-required-scope: settlements:read
      parameters:
        - { name: apiID, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: settlements
  /apis/{apiID}/batch-settlements:
    get:
      summary: List batch settlements
      x-required-scope: settlements:read
      parameters:
        - { name: apiID, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: batch settlements
  /apis/{apiID}/batch:
    get:
      summary: Batch channel overview
      x-required-scope: settlements:read
      parameters:
        - { name: apiID, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: batch overview
  /apis/{apiID}/batch/settings:
    put:
      summary: Update batch worker intervals
      x-required-scope: apis:write
      parameters:
        - { name: apiID, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [claim_interval_secs, settle_interval_secs, refund_interval_secs]
              properties:
                claim_interval_secs: { type: integer }
                settle_interval_secs: { type: integer }
                refund_interval_secs: { type: integer }
      responses:
        '200':
          description: updated batch overview
  /settlements:
    get:
      summary: Account payment history
      x-required-scope: settlements:read
      parameters:
        - name: days
          in: query
          schema: { type: integer, default: 30 }
        - name: limit
          in: query
          schema: { type: integer }
        - name: offset
          in: query
          schema: { type: integer }
        - name: api_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: payment history page
  /billing:
    get:
      summary: Billing overview
      x-required-scope: billing:read
      responses:
        '200':
          description: billing overview
  /billing/packages:
    get:
      summary: Billing packages
      x-required-scope: billing:read
      responses:
        '200':
          description: packages
  /billing/invoices:
    get:
      summary: Billing invoices
      x-required-scope: billing:read
      responses:
        '200':
          description: invoices
  /income/summary:
    get:
      summary: Income summary
      x-required-scope: income:read
      responses:
        '200':
          description: income summary
  /income/ledger:
    get:
      summary: Income ledger
      x-required-scope: income:read
      responses:
        '200':
          description: ledger page
  /income/payout-requests:
    get:
      summary: List payout requests
      x-required-scope: income:read
      responses:
        '200':
          description: payout requests
  /supported-networks:
    get:
      summary: Facilitator supported networks
      responses:
        '200':
          description: passthrough from facilitator /supported
