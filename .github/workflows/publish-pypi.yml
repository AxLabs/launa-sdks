name: Publish PyPI

on:
  workflow_dispatch:
  # Tag publish disabled until PyPI trusted publishing is configured.

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish launa-sdk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      # packages-dir is repo-root-relative; working-directory does not apply to the action.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist
