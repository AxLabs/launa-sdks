name: Publish npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @launa packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Use npm 11+
        run: npm install -g npm@^11.10.0

      - name: Print versions
        run: |
          node -v
          npm -v
          pnpm -v

      - name: Verify tag matches package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          case "$TAG" in
            *-preview.*)
              SDK_VERSION="$(node -p "require('./packages/typescript/package.json').version")"
              if [ "$TAG" != "$SDK_VERSION" ]; then
                echo "Tag v${TAG} does not match @launaio/sdk version ${SDK_VERSION}"
                exit 1
              fi
              ;;
            *-*)
              echo "Unsupported prerelease tag v${TAG}; use v*-preview.*"
              exit 1
              ;;
            *)
              ROOT_VERSION="$(node -p "require('./package.json').version")"
              if [ "$TAG" != "$ROOT_VERSION" ]; then
                echo "Tag v${TAG} does not match package.json version ${ROOT_VERSION}"
                exit 1
              fi
              ;;
          esac

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @launaio/sdk --filter @launaio/cli --filter @launaio/mcp-server --filter @launaio/react-paywall build
      - run: pnpm --filter @launaio/sdk --filter @launaio/cli --filter @launaio/mcp-server test

      - name: Publish packages to npm
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$TAG" == *-preview.* ]]; then
            pnpm --filter @launaio/sdk publish \
              --access public \
              --tag preview \
              --no-git-checks
          else
            pnpm publish -r \
              --filter @launaio/sdk \
              --filter @launaio/cli \
              --filter @launaio/mcp-server \
              --filter @launaio/react-paywall \
              --access public \
              --no-git-checks
          fi
