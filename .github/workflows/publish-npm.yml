name: Publish npm

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @ax402 packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ax402/sdk --filter @ax402/cli --filter @ax402/mcp-server build
      - run: pnpm --filter @ax402/sdk --filter @ax402/cli --filter @ax402/mcp-server test
      - run: pnpm publish -r --filter @ax402/sdk --filter @ax402/cli --filter @ax402/mcp-server --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
